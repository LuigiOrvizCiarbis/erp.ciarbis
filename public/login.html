<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIMS ERP · Iniciar sesión</title>
<link rel="icon" type="image/png" href="/img/iso-erp-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#07080F;--surface:#0D0F1A;--card:#141622;--border:rgba(255,255,255,0.08);--accent:#1E40FF;--accent2:#00D4AA;--red:#FF6B6B;--text:#F0EFF8;--muted:#8B8FA8;--input-bg:rgba(255,255,255,0.05);--glow:rgba(30,64,255,0.14);--shadow:0 8px 48px rgba(0,0,0,0.45)}
:root[data-theme="light"]{--bg:#F0F2FA;--surface:#fff;--card:#fff;--border:rgba(0,0,0,0.09);--accent:#1E40FF;--accent2:#0AA882;--red:#DC2626;--text:#0A0C1A;--muted:#5A6080;--input-bg:rgba(0,0,0,0.04);--glow:rgba(30,64,255,0.08);--shadow:0 8px 48px rgba(0,0,0,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}

.header{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.logo-icon img{width:100%;height:100%;object-fit:contain}
.logo-text{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.logo-text span{color:var(--accent)}
.logo-tag{font-size:9px;color:var(--accent2);font-family:'JetBrains Mono',monospace;letter-spacing:.06em}
.header-right{display:flex;align-items:center;gap:8px}
.btn-theme{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:15px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.btn-theme:hover{color:var(--text);border-color:var(--accent)}
.btn-reg{padding:7px 16px;font-size:13px;font-weight:600;border-radius:9px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;box-shadow:0 4px 14px rgba(30,64,255,.35);transition:all .15s;text-decoration:none}
.btn-reg:hover{opacity:.9}

.main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 1.5rem 2rem;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.2;pointer-events:none}
.b1{width:500px;height:500px;background:radial-gradient(circle,#1E40FF,transparent);top:-100px;left:-150px}
.b2{width:400px;height:400px;background:radial-gradient(circle,#00D4AA,transparent);bottom:-100px;right:-100px}

.login-box{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow)}
.lhead{text-align:center;margin-bottom:2rem}
.lhead-icon{width:56px;height:56px;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem}
.lhead-icon img{width:100%;height:100%;object-fit:contain}
.lhead h1{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.3rem}
.lhead p{font-size:13px;color:var(--muted)}

.field{margin-bottom:1.1rem}
.flabel{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.finput{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.finput.err{border-color:var(--red)}
.pwd-wrap{position:relative}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px}
.forgot{display:block;text-align:right;font-size:12px;color:var(--accent);text-decoration:none;margin-top:-8px;margin-bottom:1.25rem}
.forgot:hover{text-decoration:underline}

.alert{padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:1rem;display:none}
.alert-err{background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.2)}

.btn-submit{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;box-shadow:0 4px 18px rgba(30,64,255,.35);transition:all .2s}
.btn-submit:hover{opacity:.9;transform:translateY(-1px)}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;transform:none}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.lfoot{text-align:center;margin-top:1.5rem;font-size:13px;color:var(--muted)}
.lfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.lfoot a:hover{text-decoration:underline}
.divider{display:flex;align-items:center;gap:10px;margin:1.25rem 0;color:var(--muted);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="/">
    <div><div class="logo-text"><img src="/img/logo-bims-erp-128.png" alt="BIMS ERP" style="height:28px;display:block"/></div><div class="logo-tag">by Ciarbis</div></div>
  </a>
  <div class="header-right">
    <button class="btn-theme" id="btnTheme">🌙</button>
    <a href="/register" class="btn-reg">Registrarme</a>
  </div>
</header>

<main class="main">
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="login-box">
    <div class="lhead">
      <div class="lhead-icon"><img src="/img/iso-erp-128.png" alt="BIMS"/></div>
      <h1>Bienvenido de nuevo</h1>
      <p>Ingresá con tus credenciales</p>
    </div>

    <div class="alert alert-err" id="alertErr"></div>

    <div class="field">
      <label class="flabel">Email</label>
      <input class="finput" type="email" id="email" placeholder="juan@miempresa.com" autocomplete="email">
    </div>

    <div class="field">
      <label class="flabel">Contraseña</label>
      <div class="pwd-wrap">
        <input class="finput" type="password" id="password" placeholder="••••••••" autocomplete="current-password" style="padding-right:40px" onkeydown="if(event.key==='Enter')doLogin()">
        <button class="pwd-toggle" type="button" onclick="togglePwd()">👁</button>
      </div>
    </div>

    <a href="/forgot-password" class="forgot">¿Olvidaste tu contraseña?</a>

    <button class="btn-submit" id="btnLogin" onclick="doLogin()">
      <span id="btnText">Ingresar al sistema</span>
    </button>

    <div class="divider">o</div>

    <div class="lfoot">
      ¿No tenés cuenta? <a href="/register">Registrá tu empresa</a>
    </div>
  </div>
</main>

<script>
// ── Theme ──
const html = document.documentElement
const btn = document.getElementById('btnTheme')
const t = localStorage.getItem('nexo-theme') || 'dark'
html.setAttribute('data-theme', t); btn.textContent = t === 'dark' ? '☀️' : '🌙'
btn.onclick = () => {
  const nt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
  html.setAttribute('data-theme', nt); localStorage.setItem('nexo-theme', nt)
  btn.textContent = nt === 'dark' ? '☀️' : '🌙'
}

function togglePwd() {
  const i = document.getElementById('password')
  i.type = i.type === 'password' ? 'text' : 'password'
}

async function doLogin() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const errEl = document.getElementById('alertErr')
  errEl.style.display = 'none'

  if (!email || !password) { showErr('Completá todos los campos'); return }

  const btn = document.getElementById('btnLogin')
  const txt = document.getElementById('btnText')
  btn.disabled = true
  txt.innerHTML = '<span class="spinner"></span> Ingresando...'

  try {
    const res = await fetch('/api/v1/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    })
    const data = await res.json()

    if (!res.ok) {
      showErr(data.message || 'Email o contraseña incorrectos')
      btn.disabled = false; txt.textContent = 'Ingresar al sistema'
      return
    }

    // Login exitoso — guardar token
    localStorage.setItem('nexo_token', data.token)
    localStorage.setItem('nexo_api_user', JSON.stringify(data.user))
    window.location.href = '/dashboard'

  } catch(e) {
    showErr('Error de conexión. Intentá de nuevo.')
    btn.disabled = false; txt.textContent = 'Ingresar al sistema'
  }
}

function showErr(msg) {
  const el = document.getElementById('alertErr')
  el.textContent = msg; el.style.display = 'block'
}

// Auto-redirect desactivado hasta que /dashboard exista
</script>
</body>
</html>
