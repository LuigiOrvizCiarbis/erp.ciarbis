<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIMS ERP · Nueva contraseña</title>
<link rel="icon" type="image/png" href="/img/iso-erp-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="dark"]{--bg:#07080F;--surface:#0D0F1A;--card:#141622;--border:rgba(255,255,255,0.08);--accent:#1E40FF;--accent2:#00D4AA;--red:#FF6B6B;--text:#F0EFF8;--muted:#8B8FA8;--input-bg:rgba(255,255,255,0.05);--glow:rgba(30,64,255,0.14);--shadow:0 8px 48px rgba(0,0,0,0.45)}
:root[data-theme="light"]{--bg:#F0F2FA;--surface:#fff;--card:#fff;--border:rgba(0,0,0,0.09);--accent:#1E40FF;--accent2:#0AA882;--red:#DC2626;--text:#0A0C1A;--muted:#5A6080;--input-bg:rgba(0,0,0,0.04);--glow:rgba(30,64,255,0.08);--shadow:0 8px 48px rgba(0,0,0,0.12)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .25s,color .25s}
.header{position:fixed;top:0;left:0;right:0;z-index:100;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;background:var(--surface);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.logo-icon img{width:100%;height:100%;object-fit:contain}
.logo-text{font-size:16px;font-weight:800;color:var(--text);letter-spacing:-.3px}
.logo-text span{color:var(--accent)}
.btn-theme{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:15px;transition:all .15s;display:flex;align-items:center;justify-content:center}
.btn-theme:hover{color:var(--text);border-color:var(--accent)}
.main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:80px 1.5rem 2rem;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.2;pointer-events:none}
.b1{width:500px;height:500px;background:radial-gradient(circle,#1E40FF,transparent);top:-100px;left:-150px}
.b2{width:400px;height:400px;background:radial-gradient(circle,#00D4AA,transparent);bottom:-100px;right:-100px}
.login-box{position:relative;z-index:1;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;box-shadow:var(--shadow)}
.lhead{text-align:center;margin-bottom:2rem}
.lhead-icon{width:56px;height:56px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin:0 auto 1rem;box-shadow:0 6px 20px rgba(30,64,255,.4)}
.lhead h1{font-size:1.4rem;font-weight:800;letter-spacing:-.02em;margin-bottom:.3rem}
.lhead p{font-size:13px;color:var(--muted)}
.field{margin-bottom:1.1rem}
.flabel{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;letter-spacing:.02em}
.finput{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;padding:11px 13px;outline:none;transition:border-color .2s,box-shadow .2s}
.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.pwd-wrap{position:relative}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:2px}
.alert{padding:10px 14px;border-radius:9px;font-size:13px;margin-bottom:1rem;display:none}
.alert-err{background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.2)}
.alert-ok{background:rgba(0,212,170,.1);color:var(--accent2);border:1px solid rgba(0,212,170,.25)}
.btn-submit{width:100%;padding:13px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;box-shadow:0 4px 18px rgba(30,64,255,.35);transition:all .2s}
.btn-submit:hover{opacity:.9;transform:translateY(-1px)}
.btn-submit:disabled{opacity:.45;cursor:not-allowed;transform:none}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.lfoot{text-align:center;margin-top:1.5rem;font-size:13px;color:var(--muted)}
.lfoot a{color:var(--accent);text-decoration:none;font-weight:600}
.lfoot a:hover{text-decoration:underline}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="/">
    <div class="logo-text"><img src="/img/logo-bims-erp-128.png" alt="BIMS ERP" style="height:30px;display:block"/></div>
  </a>
  <button class="btn-theme" id="btnTheme">🌙</button>
</header>

<main class="main">
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="login-box">
    <div class="lhead">
      <div class="lhead-icon">🔒</div>
      <h1>Elegí tu nueva contraseña</h1>
      <p>Mínimo 8 caracteres</p>
    </div>

    <div class="alert alert-err" id="alertErr"></div>
    <div class="alert alert-ok" id="alertOk"></div>

    <div id="formWrap">
      <div class="field">
        <label class="flabel">Contraseña nueva</label>
        <div class="pwd-wrap">
          <input class="finput" type="password" id="pass1" placeholder="••••••••" autocomplete="new-password" style="padding-right:40px">
          <button class="pwd-toggle" type="button" onclick="togglePwd('pass1')">👁</button>
        </div>
      </div>
      <div class="field">
        <label class="flabel">Repetir contraseña nueva</label>
        <div class="pwd-wrap">
          <input class="finput" type="password" id="pass2" placeholder="••••••••" autocomplete="new-password" style="padding-right:40px" onkeydown="if(event.key==='Enter')doReset()">
          <button class="pwd-toggle" type="button" onclick="togglePwd('pass2')">👁</button>
        </div>
      </div>
      <button class="btn-submit" id="btnGuardar" onclick="doReset()">
        <span id="btnText">Guardar contraseña</span>
      </button>
    </div>

    <div class="lfoot">
      <a href="/login">← Volver a iniciar sesión</a>
    </div>
  </div>
</main>

<script>
const html = document.documentElement
const btnT = document.getElementById('btnTheme')
const t = localStorage.getItem('nexo-theme') || 'dark'
html.setAttribute('data-theme', t); btnT.textContent = t === 'dark' ? '☀️' : '🌙'
btnT.onclick = () => {
  const nt = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
  html.setAttribute('data-theme', nt); localStorage.setItem('nexo-theme', nt)
  btnT.textContent = nt === 'dark' ? '☀️' : '🌙'
}

function togglePwd(id) {
  const i = document.getElementById(id)
  i.type = i.type === 'password' ? 'text' : 'password'
}

const params = new URLSearchParams(window.location.search)
const token = params.get('token')
if (!token) {
  document.getElementById('alertErr').textContent = 'Este link no es válido. Pedí uno nuevo desde "Olvidé mi contraseña".'
  document.getElementById('alertErr').style.display = 'block'
  document.getElementById('formWrap').style.display = 'none'
}

async function doReset() {
  const p1 = document.getElementById('pass1').value
  const p2 = document.getElementById('pass2').value
  const errEl = document.getElementById('alertErr')
  const okEl = document.getElementById('alertOk')
  errEl.style.display = 'none'; okEl.style.display = 'none'

  if (p1.length < 8) { errEl.textContent = 'La contraseña debe tener al menos 8 caracteres'; errEl.style.display = 'block'; return }
  if (p1 !== p2) { errEl.textContent = 'Las contraseñas no coinciden'; errEl.style.display = 'block'; return }

  const btn = document.getElementById('btnGuardar')
  const txt = document.getElementById('btnText')
  btn.disabled = true
  txt.innerHTML = '<span class="spinner"></span> Guardando...'

  try {
    const res = await fetch('/api/v1/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: p1 })
    })
    const data = await res.json()
    if (!res.ok) {
      errEl.textContent = data.message || 'No se pudo actualizar la contraseña'
      errEl.style.display = 'block'
      btn.disabled = false; txt.textContent = 'Guardar contraseña'
      return
    }
    okEl.textContent = 'Contraseña actualizada. Ya podés iniciar sesión.'
    okEl.style.display = 'block'
    document.getElementById('formWrap').style.display = 'none'
    setTimeout(() => { window.location.href = '/login' }, 2000)
  } catch (e) {
    errEl.textContent = 'Error de conexión. Intentá de nuevo.'
    errEl.style.display = 'block'
    btn.disabled = false; txt.textContent = 'Guardar contraseña'
  }
}
</script>
</body>
</html>
